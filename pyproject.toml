[project]
name = "ktundepo"
version = "1.0.0"
description = "ktunDepo Agentic AI System"
requires-python = ">=3.11"
authors = [
    { name = "ktunDepo Team" }
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.3.0",
    "python-telegram-bot>=21.0",
    "docling>=2.0.0",
    "pypdf2>=3.0.0",
    "pdfplumber>=0.10.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=2.7.0",
    "watchdog>=4.0.0",
    "gitpython>=3.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "schedule>=1.2.0",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27",
    "aiofiles>=23.0.0",
    "asyncio-throttle>=1.0.0",
    # Intake agent dependencies
    "anthropic>=0.40.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "pdf2image>=1.16.0",
    "python-pptx>=0.6.21",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "bot*", "scripts*", "vector_db*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
